[package]
name = "llm-budget-openai-api-rs-example"
version = "0.0.0"
edition = "2021"
publish = false

# A standalone example: a chat loop on openai-api-rs with a hard USD cap from llm-budget.
# Run: OPENAI_API_KEY=sk-... cargo run --manifest-path examples/openai-api-rs/Cargo.toml

[workspace]

[dependencies]
llm-budget = { path = "../.." }
openai-api-rs = "10.0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
