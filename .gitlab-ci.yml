# Library CI on every push and merge request. Nothing is released from here:
# crates.io publishing is done by hand.

image: rust:1

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
  CARGO_TERM_COLOR: always

cache:
  key: cargo-${CI_JOB_NAME}
  paths: [.cargo-home/registry, target/]

stages: [test]

test:
  stage: test
  script:
    - rustup component add clippy
    - cargo build --all-features
    - cargo test --all-features
    - cargo test --no-default-features
    - cargo test --manifest-path integrations/borg/Cargo.toml
    - cargo clippy --all-targets --all-features -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
    - cargo run --example quickstart
    - cargo run --example persist_restore
    - cargo run --example provider_usage
    - cargo run --example tokens --features tokens
    - cargo run --example rate_limit --features ratelimit,tracing
    - cargo run --example rig_budget_hook --features __rig-test-utils
    - cargo run --example record_usage --no-default-features
    - cargo run --example async_openai_budget --features async-openai
    - cargo run --example genai_budget --features genai

# The oldest Rust this crate promises to build on (rust-version in Cargo.toml).
msrv:
  stage: test
  image: rust:1.85
  variables:
    # pick dependency versions that support this Rust
    CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  script:
    # every feature except `rig` (needs Rust 1.95+, rig-agent's own minimum) and
    # `genai` (follows genai's own minimum Rust)
    - cargo build --features tokens,ratelimit,tracing,metrics,schemars,async-openai
    - cargo test
    - cargo test --features tokens,ratelimit,tracing,metrics,schemars,async-openai
