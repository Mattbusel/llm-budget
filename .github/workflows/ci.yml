name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-features
      - name: Test
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: rig examples
        run: |
          cargo run --example rig_budget_hook --features __rig-test-utils
          cargo run --example rig_tracing_cost --features tracing-layer,__rig-test-utils
          cargo run --example rig_scopes --features __rig-test-utils
      - name: No default features (no async runtime)
        run: cargo test --no-default-features
      - name: Integration examples
        run: |
          cargo run --example record_usage --no-default-features
          cargo run --example metrics_cost --features metrics-layer
          cargo run --example async_openai_budget --features async-openai
          cargo run --example genai_budget --features genai
          cargo run --example tower_budget --features tower
          cargo run --example fanout

  # The oldest Rust this crate promises (rust-version in Cargo.toml). Every
  # feature except `rig`, which needs Rust 1.95+ (rig-agent's own minimum), and
  # `genai`, which follows genai's own minimum Rust.
  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Test (all features but rig)
        run: cargo test --features tokens,ratelimit,tracing,tracing-layer,metrics,metrics-layer,schemars,async-openai,tower
