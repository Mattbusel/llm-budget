[package]
name = "llm-budget"
version = "0.1.0"
edition = "2021"
description = "Autonomous cost governance primitives — hard budget enforcement across agent fleets"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[dependencies]
# tokio: async runtime + atomics
tokio = { version = "1.40", features = ["full"] }
# serde: budget persistence serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# thiserror: typed error hierarchy
thiserror = "1.0"
# async-trait: trait objects for budget backends
async-trait = "0.1"
# rust_decimal: exact monetary arithmetic — never use f64 for money
rust_decimal = { version = "1.35", features = ["serde-with-str"] }
# dashmap: lock-free concurrent fleet state
dashmap = "5.5"
# uuid: agent/task/session identifiers
uuid = { version = "1.6", features = ["v4", "fast-rng", "serde"] }
# chrono: spend window timestamps
chrono = { version = "0.4", features = ["serde"] }
# tracing: observability for spend events
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
criterion = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = "0.3"

[[bench]]
name = "budget_hot_path"
harness = false
