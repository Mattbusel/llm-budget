[package]
name = "llm-budget"
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
description = "Hard USD spend limits for LLM agents: per-agent and fleet caps, child scopes for parallel sub-agents, real per-model prices, kill switch, automatic model downgrade"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mattbusel/llm-budget"
homepage = "https://tensorust.com/open-source/"
documentation = "https://docs.rs/llm-budget"
keywords = ["llm", "budget", "cost", "agents", "openai"]
categories = ["development-tools", "asynchronous", "concurrency"]
include = ["src/**/*.rs", "benches/**/*.rs", "examples/**/*.rs", "scripts/update_prices.py", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[features]
default = ["store"]
## `BudgetStore`: save and restore spend as JSON files (async, on tokio).
## Without it the crate has no async runtime dependency at all.
store = ["dep:tokio"]
## Count tokens from text with OpenAI's tokenizers (tiktoken-rs).
tokens = ["dep:tiktoken-rs"]
## Tokens-per-minute and requests-per-minute limits (governor).
ratelimit = ["dep:governor"]
## Log charges, refusals, downgrades and kills as tracing events.
tracing = ["dep:tracing"]
## `tracing_layer::CostLayer`: a tracing-subscriber layer that prices every
## span carrying OpenTelemetry GenAI usage fields (rig emits them), emits
## `gen_ai.usage.cost`, and can book the spend on a capped `AgentBudget`.
tracing-layer = ["dep:tracing", "dep:tracing-subscriber"]
## Export spend and refusal counters through the metrics facade (Prometheus, StatsD, ...).
metrics = ["dep:metrics"]
## `metrics_layer::CostLayer`: a metrics-util layer that prices token counters
## (swiftide's, or any model-labelled ones) into a USD metric and an optional budget.
metrics-layer = ["metrics", "dep:metrics-util"]
## `tower_layer::BudgetLayer`: a tower Layer that reserves before each call, refuses calls
## over the cap before they are sent, and settles the provider's reported usage. Includes a
## ready-made estimator and usage reader for OpenAI-compatible `http` requests.
tower = ["dep:tower", "dep:http", "dep:bytes"]
## JSON Schema for the serialized types (schemars).
schemars = ["dep:schemars"]
## `openai` module and `From<&CompletionUsage>` for async-openai users: settle
## from a chat completion or the final usage chunk of a stream (types only, no
## HTTP client).
async-openai = ["dep:async-openai"]
## `genai` module: run a genai `Client` chat call (or stream) under a
## reserve/settle hold.
genai = ["dep:genai"]
## `rig::BudgetHook`, a dollar cap for rig agents (rig-agent 0.44 to 0.46; needs
## Rust 1.95 for rig-agent 0.44, 1.97.1 for 0.46).
rig = ["dep:rig-agent"]
## Internal: rig's mock models for this crate's rig tests and example. Not part
## of the public API and not covered by semver.
__rig-test-utils = ["rig", "rig-agent/test-utils"]

[dependencies]
# async file I/O and the cache lock of BudgetStore (feature "store", default)
tokio = { version = "1.40", features = ["sync", "fs"], optional = true }
# dated, source-cited prices (no dependencies of its own)
llm-prices = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# lock-free agent registry
dashmap = "5.5"
# exact token counts (feature "tokens")
tiktoken-rs = { version = "0.12.1", optional = true }
# rate limits (feature "ratelimit")
governor = { version = "0.10", default-features = false, features = ["std"], optional = true }
# observability (features "tracing" and "metrics")
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
metrics = { version = "0.24", default-features = false, optional = true }
# CostLayer (feature "tracing-layer")
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["registry", "std"], optional = true }
# CostLayer for metrics (feature "metrics-layer")
metrics-util = { version = "0.20", default-features = false, optional = true }
# BudgetLayer (feature "tower")
tower = { version = "0.5", default-features = false, optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
# JSON Schema (feature "schemars")
schemars = { version = "1", optional = true }
# async-openai interop (feature "async-openai"), types only
async-openai = { version = "0.42", default-features = false, features = ["chat-completion-types"], optional = true }
# genai integration (feature "genai")
genai = { version = "0.7", optional = true }
# rig agent hook (feature "rig")
rig-agent = { version = ">=0.44, <0.47", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util"] }
# service_fn and ServiceExt for the BudgetLayer tests, docs and example
tower = { version = "0.5", default-features = false, features = ["util"] }
tempfile = "3.9"
# examples/genai_budget.rs reads the genai stream
futures-util = { version = "0.3", default-features = false }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"
metrics-util = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# for benches/vs_alternatives.rs: the previous release and a rate limiter
llm_budget_011 = { package = "llm-budget", version = "=0.1.1" }
governor = { version = "0.10", default-features = false, features = ["std"] }

[[bench]]
name = "budget_hot_path"
harness = false

[[bench]]
name = "vs_alternatives"
harness = false

[[example]]
name = "quickstart"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "tokens"
required-features = ["tokens"]

[[example]]
name = "persist_restore"
required-features = ["store"]

[[example]]
name = "record_usage"

# Runs offline: the responses are canned JSON. cargo run --example async_openai_budget --features async-openai
[[example]]
name = "async_openai_budget"
required-features = ["async-openai"]

# Calls a real provider when OPENAI_API_KEY (or another genai key) is set.
[[example]]
name = "genai_budget"
required-features = ["genai"]

[[example]]
name = "provider_usage"

# Offline: prints the cost of swiftide-style token counters. cargo run --example metrics_cost --features metrics-layer
[[example]]
name = "metrics_cost"
required-features = ["metrics-layer"]

[[example]]
name = "rate_limit"
required-features = ["ratelimit", "tracing"]

# Runs offline against rig's mock model: cargo run --example rig_budget_hook --features __rig-test-utils
[[example]]
name = "rig_budget_hook"
required-features = ["rig", "__rig-test-utils"]

# Offline: rig's mock model traced through CostLayer.
# cargo run --example rig_tracing_cost --features tracing-layer,__rig-test-utils
[[example]]
name = "rig_tracing_cost"
required-features = ["tracing-layer", "rig", "__rig-test-utils"]

[[test]]
name = "tracing_layer"
required-features = ["tracing-layer"]

# rig's mock models need rig-agent's `test-utils` feature (and Rust 1.95+), so
# these tests only build when asked for; plain `cargo test` stays on the MSRV.
[[test]]
name = "rig_hook"
required-features = ["rig", "__rig-test-utils"]

# talks HTTP to a local mock server through a real genai Client
[[test]]
name = "genai_mock"
required-features = ["genai"]

[[example]]
name = "tower_budget"
required-features = ["tower"]

# Four parallel sub-agents under one cap, offline: cargo run --example fanout
[[example]]
name = "fanout"

# A budget carried over A2A metadata and MCP _meta baggage, offline.
[[example]]
name = "budget_context"

# A rig orchestrator with two sub-agents in child scopes, offline.
# cargo run --example rig_scopes --features __rig-test-utils
[[example]]
name = "rig_scopes"
required-features = ["rig", "__rig-test-utils"]

[[test]]
name = "tower_layer"
required-features = ["tower"]
