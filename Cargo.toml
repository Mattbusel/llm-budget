[package]
name = "llm-budget"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
description = "Hard USD spend limits for LLM agents: per-agent and fleet caps, real per-model prices, kill switch, automatic model downgrade"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mattbusel/llm-budget"
homepage = "https://tensorust.com/open-source/"
documentation = "https://docs.rs/llm-budget"
keywords = ["llm", "budget", "cost", "agents", "openai"]
categories = ["development-tools", "asynchronous", "concurrency"]
include = ["src/**/*.rs", "benches/**/*.rs", "examples/**/*.rs", "scripts/update_prices.py", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[features]
default = []
## Count tokens from text with OpenAI's tokenizers (tiktoken-rs).
tokens = ["dep:tiktoken-rs"]
## Tokens-per-minute and requests-per-minute limits (governor).
ratelimit = ["dep:governor"]
## Log charges, refusals, downgrades and kills as tracing events.
tracing = ["dep:tracing"]
## Export spend and refusal counters through the metrics facade (Prometheus, StatsD, ...).
metrics = ["dep:metrics"]
## JSON Schema for the serialized types (schemars).
schemars = ["dep:schemars"]
## `From<&CompletionUsage>` for async-openai users (types only, no HTTP client).
async-openai = ["dep:async-openai"]
## `rig::BudgetHook`, a dollar cap for rig agents (rig-agent 0.44, needs Rust 1.95).
rig = ["dep:rig-agent"]

[dependencies]
# sync primitives for the cascade and audit log, async file I/O for BudgetStore
tokio = { version = "1.40", features = ["sync", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# lock-free agent registry
dashmap = "5.5"
# exact token counts (feature "tokens")
tiktoken-rs = { version = "0.12.1", optional = true }
# rate limits (feature "ratelimit")
governor = { version = "0.10", default-features = false, features = ["std"], optional = true }
# observability (features "tracing" and "metrics")
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
metrics = { version = "0.24", default-features = false, optional = true }
# JSON Schema (feature "schemars")
schemars = { version = "1", optional = true }
# async-openai interop (feature "async-openai"), types only
async-openai = { version = "0.42", default-features = false, features = ["chat-completion-types"], optional = true }
# rig agent hook (feature "rig")
rig-agent = { version = "0.44", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tempfile = "3.9"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"
metrics-util = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# for benches/vs_alternatives.rs: the previous release and a rate limiter
llm_budget_011 = { package = "llm-budget", version = "=0.1.1" }
governor = { version = "0.10", default-features = false, features = ["std"] }
# mock models for the rig hook tests and doc example
rig-agent = { version = "0.44", default-features = false, features = ["test-utils"] }

[[bench]]
name = "budget_hot_path"
harness = false

[[bench]]
name = "vs_alternatives"
harness = false

[[example]]
name = "quickstart"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "tokens"
required-features = ["tokens"]

[[example]]
name = "persist_restore"

[[example]]
name = "provider_usage"

[[example]]
name = "rate_limit"
required-features = ["ratelimit", "tracing"]
